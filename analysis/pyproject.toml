[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "awh-analysis"
version = "0.1.0"
description = "Analysis engine: measurements + explanations for rendered audio (BS.1770 loudness, spectrum, stereo, dynamics)."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "numpy",
    "scipy",
    "soundfile",
    "pyloudnorm",
    # Sample-library index/search/similarity (`samplescan`): spectral
    # centroid/rolloff/flatness + MFCCs. ISC license, audited with the a2m
    # extra. A base dependency because `awh samples index` is not an
    # optional feature.
    "librosa",
]

# Audio-to-MIDI (`a2m`): the ONNX-backend runtime deps for basic-pitch,
# without basic-pitch itself. Its PyPI metadata unconditionally requires
# tensorflow on Linux/py>=3.11 (not gated behind an extra), so it must be
# installed separately with --no-deps. See analysis/README.md for the exact
# two-step install command and the license audit of everything it pulls in.
[project.optional-dependencies]
a2m = [
    "onnxruntime",
    "mir_eval",
    "pretty_midi",
    "resampy",
    "scikit-learn",
    "typing_extensions",
]

# Semantic sample search (`clapembed`): LAION-CLAP, torch CPU (torch is
# already a base install, see analysis/README.md). Not installed in the dev
# container, where Hugging Face is egress-blocked and the checkpoint is
# unreachable; AWH_CLAP_STUB=1 covers all container/CI testing without
# importing this extra. See analysis/README.md for the
# checkpoint download + license audit.
clap = [
    "laion_clap",
]

# Test runner and coverage: `pip install -e '.[dev]'` from analysis/.
dev = [
    "pytest",
    "pytest-cov",
    # Pre-1.0: a minor release can change lint or format output, so pin.
    "ruff==0.16.10",
]

[project.scripts]
awh-analysis = "awh_analysis.__main__:main"

[tool.setuptools.packages.find]
include = ["awh_analysis*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# F: unused names; E: pycodestyle; B: likely bugs; BLE001: blind
# `except Exception`; ERA001: commented-out code; T201: print in library code.
select = ["E", "F", "B", "BLE001", "ERA001", "T201"]
# The formatter owns wrapping. What it leaves over 100 columns is long
# strings and comments, which E501 would only ask to split by hand.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# The CLI's output is its print calls; library modules log instead.
"awh_analysis/__main__.py" = ["T201"]

[tool.coverage.run]
source = ["awh_analysis"]

[tool.coverage.report]
show_missing = true
# Floor only goes up; see docs/quality-plan.md.
fail_under = 74
