name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: Node (build, typecheck, coverage)
    runs-on: ubuntu-24.04
    env:
      AWH_CLAP_STUB: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.28.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      # CLI tests that call the analysis engine skip without the venv.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: analysis/pyproject.toml
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Build analysis venv
        run: |
          python -m venv .venv
          .venv/bin/pip install -e 'analysis[dev]'
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # Type-aware lint resolves @awh/core through its built .d.ts files, so
      # it must run after the build.
      - run: pnpm lint
      # The extension is typechecked against types/ableton-sdk-shim.d.ts but
      # not bundled: the Ableton SDK is not redistributable.
      - run: pnpm typecheck
      - run: pnpm coverage

  python:
    name: Python (analysis tests)
    runs-on: ubuntu-24.04
    env:
      AWH_CLAP_STUB: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: analysis/pyproject.toml
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Build analysis venv
        run: |
          python -m venv .venv
          .venv/bin/pip install -e 'analysis[dev]'
      # Ruff and pyright move to the lint job in quality plan L12.
      - name: Lint with ruff
        working-directory: analysis
        run: ../.venv/bin/ruff check .
      - name: Check formatting with ruff
        if: ${{ !cancelled() }}
        working-directory: analysis
        run: ../.venv/bin/ruff format --check .
      - name: Typecheck with pyright
        if: ${{ !cancelled() }}
        working-directory: analysis
        run: ../.venv/bin/pyright
      - name: Test with coverage
        if: ${{ !cancelled() }}
        working-directory: analysis
        run: ../.venv/bin/pytest -q --cov
