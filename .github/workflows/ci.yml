name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # A required status check matches this job by its name, so renaming it
  # silently drops the requirement until branch protection is updated.
  lint:
    name: Lint (oxlint, oxfmt, ruff, pyright)
    runs-on: ubuntu-24.04
    steps:
      - id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.28.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - id: install
        run: pnpm install --frozen-lockfile
      # Type-aware lint resolves @awh/core through its built .d.ts files, so
      # it must run after the build.
      - id: build
        run: pnpm build
      # The Python setup runs even when the Node build failed, so the Python
      # checks below still report.
      - id: python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: analysis/pyproject.toml
      # Pyright resolves numpy, scipy and librosa types from the installed
      # packages, so the venv needs the full install, not just the tools.
      - name: Build analysis venv
        id: venv
        if: ${{ !cancelled() && steps.python.outcome == 'success' }}
        run: |
          python -m venv .venv
          .venv/bin/pip install -e 'analysis[dev]'
      # Each check runs when its own setup succeeded, so one run reports
      # every lint failure instead of stopping at the first.
      - run: pnpm lint
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
      - run: pnpm fmt:check
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
      - name: Lint with ruff
        if: ${{ !cancelled() && steps.venv.outcome == 'success' }}
        working-directory: analysis
        run: ../.venv/bin/ruff check .
      - name: Check formatting with ruff
        if: ${{ !cancelled() && steps.venv.outcome == 'success' }}
        working-directory: analysis
        run: ../.venv/bin/ruff format --check .
      - name: Typecheck with pyright
        if: ${{ !cancelled() && steps.venv.outcome == 'success' }}
        working-directory: analysis
        run: ../.venv/bin/pyright
      # rhysd/actionlint ships as a binary, not an action, so the release is
      # pinned by version and its checksum from the release's checksums file.
      # actionlint skips its shellcheck rule when shellcheck is missing, so
      # the step fails first if the runner image stops providing it.
      - name: Lint workflows with actionlint
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          command -v shellcheck
          tarball="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          cd "$RUNNER_TEMP"
          curl -fsSLO "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${tarball}"
          echo "${ACTIONLINT_SHA256}  ${tarball}" | sha256sum -c -
          tar -xzf "$tarball" actionlint
          cd "$GITHUB_WORKSPACE"
          "$RUNNER_TEMP/actionlint" -color

  node:
    name: Node (build, typecheck, coverage)
    runs-on: ubuntu-24.04
    env:
      AWH_CLAP_STUB: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.28.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      # The CLI's "integ:" tests call the analysis engine through the venv.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: analysis/pyproject.toml
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Build analysis venv
        run: |
          python -m venv .venv
          .venv/bin/pip install -e 'analysis[dev]'
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # The extension is typechecked against types/ableton-sdk-shim.d.ts but
      # not bundled: the Ableton SDK is not redistributable.
      - run: pnpm typecheck
      # The venv is built above, so a missing analysis Python fails the run
      # instead of skipping the "integ:" CLI tests. (The binary smoke test
      # skips on an unbuilt CLI, which `pnpm build` above rules out.)
      - run: pnpm coverage
        env:
          AWH_REQUIRE_INTEG: "1"

  python:
    name: Python (analysis tests)
    runs-on: ubuntu-24.04
    env:
      AWH_CLAP_STUB: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: analysis/pyproject.toml
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Build analysis venv
        run: |
          python -m venv .venv
          .venv/bin/pip install -e 'analysis[dev]'
      - name: Test with coverage
        working-directory: analysis
        # `integ` tests need basic-pitch, which the dev extra does not
        # install; deselected here by name rather than skipped.
        run: ../.venv/bin/pytest -q --cov -m "not integ"
